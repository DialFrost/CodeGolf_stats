<!DOCTYPE html>
<html lang="en">
<head class="header">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="wrapper">
        <nav class="sidebar">
            <div class="tab-container">
                <button class="tab-btn active" data-target="scatter">Scatter</button>
                <button class="tab-btn" data-target="heatmap">Heatmap</button>
                <button class="tab-btn" data-target="deflation">Deflation</button>
                <button class="tab-btn" data-target="golds-lost">Golds Lost</button>
            </div>

            <div id="scatter" class="option-content">
                <div class="dropdown">
                    <label for="language">Language:</label>
                    <select class="language"></select>
                </div>

                <div class="dropdown">
                    <label for="hole">Hole:</label>
                    <select class="hole"></select>
                </div>

                <div class="dropdown">
                    <label for="medal">Medal type:</label>
                    <select id="medal">
                        <option value="golds">Golds</option>
                        <option value="diamonds">Diamonds</option>
                    </select>
                </div>

                <div class="dropdown">
                    <label for="weight">Weight:</label>
                    <select id="weight">
                        <option value="all">All</option>
                        <option value="per hole">per hole</option>
                        <option value="per lang">per lang</option>
                        <option value="per hole&lang">per hole&lang</option>
                    </select>
                </div>

                <div class="dropdown">
                    <label for="plot">Plot type:</label>
                    <select id="plot">
                        <option value="graph">Graph</option>
                        <option value="stack">Stack</option>
                    </select>
                </div>
                
                <div class="rank-bounds">
                    <label>Rank: </label>
                    <input type="number" id="lowerBound" class="rank-input" value="1" min="1">
                    <span> to </span>
                    <input type="number" id="upperBound" class="rank-input" value="10" min="1">
                </div>
            </div>

            <div id="heatmap" class="option-content hidden">
                <div class="user">
                    <label>Username: </label>
                    <input class="username"></input>
                </div>
            </div>

            <div id="deflation" class="option-content hidden">
                <div class="dropdown">
                    <label for="language">Language:</label>
                    <select class="language"></select>
                </div>

                <div class="dropdown">
                    <label for="hole">Hole:</label>
                    <select class="hole"></select>
                </div>
            </div>

            <div id="golds-lost" class="option-content hidden">
                <div class="user">
                    <label>Username: </label>
                    <input class="username"></input>
                </div>
                <div class="dropdown">
                    <label for="table">Medals type:</label>
                    <select id="table">
                        <option value="all">All</option>
                        <option value="gold">Golds</option>
                        <option value="diamond">Diamonds</option>
                    </select>
                </div>
            </div>

            <input type="file" class="file-btn" id="file-upload" accept=".json"/>

            <button class="graph-btn" id="graph">Generate</button>

            <div class="toggle-group">
                <span>Dark Mode Toggle</span>
                <label class="toggle">
                    <input id="togglebox" type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </nav>

        <main class="content-area">
            <p id="status">Select options and click Generate</p>
            <div id="plot-container"></div>
            <div class="table-container hidden">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Lost</th>
                            <th>Hole</th>
                            <th>Lang</th>
                            <th>Change</th>
                            <th>User</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>

                <div id="pagination">
                    <button id="prevPage">Previous</button>
                    <span id="pageInfo">Page 1 of 10</span>
                    <button id="nextPage">Next</button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/arquero@latest"></script>
    <script src="main.js"></script>
    <script src="heatmap.js"></script>
    <script src="scatter.js"></script>
    <script src="deflation.js"></script>
    <script src="goldsLost.js"></script>
</body>
